[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-tokens"
version = "0.1.0"
description = "SOLAR - token optimization layer for LLM workflows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "cokovali10-sketch" }]
keywords = ["llm", "tokens", "prompt", "compression", "cache", "openai", "optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
exact = ["tiktoken>=0.7"]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/cokovali10-sketch/solar"
Repository = "https://github.com/cokovali10-sketch/solar"
Issues = "https://github.com/cokovali10-sketch/solar/issues"

[project.scripts]
solar = "solar.cli:main"

[tool.setuptools.packages.find]
include = ["solar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
