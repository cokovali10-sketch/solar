[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-tokens"
version = "0.1.0"
description = "SOLAR - token optimization layer for LLM workflows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "cokovali10-sketch" }]
dependencies = []

[project.optional-dependencies]
exact = ["tiktoken>=0.7"]
dev = ["pytest>=8"]

[project.scripts]
solar = "solar.cli:main"

[tool.setuptools.packages.find]
include = ["solar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
